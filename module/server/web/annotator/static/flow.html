<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAS 自定义流程</title>
  <link rel="stylesheet" href="/tool/annotator/static/css/base.css">
  <style>
    .flow-app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .flow-topbar {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: linear-gradient(180deg, var(--bg-topbar-1), var(--bg-topbar-2));
      border-bottom: 1px solid var(--line-main);
    }
    .flow-topbar h1 { margin: 0; font-size: 15px; color: var(--text-title); font-weight: 600; }
    .flow-topbar a { color: var(--accent); font-size: 12px; text-decoration: none; }
    .flow-topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .flow-topbar-actions label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
    #flowStatus { font-size: 12px; color: var(--text-muted); min-width: 90px; }
    button, select, input {
      font-family: inherit; font-size: 12px; color: var(--text-main);
      background: linear-gradient(180deg, var(--bg-button-1), var(--bg-button-2));
      border: 1px solid var(--line-input); border-radius: 4px; padding: 4px 8px;
    }
    input { background: var(--bg-input); }
    button { cursor: pointer; }
    button:hover { background: linear-gradient(180deg, var(--bg-button-hover-1), var(--bg-button-hover-2)); }
    button.danger { color: var(--danger); border-color: var(--danger-border); }

    .flow-layout { flex: 1; display: grid; grid-template-columns: 300px minmax(320px, 1fr) 420px; gap: 8px; padding: 8px; min-height: 0; }
    .flow-pane { display: flex; flex-direction: column; min-height: 0; background: var(--bg-panel-1); border: 1px solid var(--line-main); border-radius: 6px; overflow: hidden; }
    .pane-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px; color: var(--text-secondary); background: var(--bg-subpanel); border-bottom: 1px solid var(--line-soft); }
    .pane-head-actions { margin-left: auto; display: flex; gap: 4px; }

    .step-tree { flex: 1; overflow: auto; padding: 6px; }
    .step-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .step-row:hover { background: var(--bg-button-hover-2); }
    .step-row.selected { background: var(--selected-bg); border-color: var(--accent); }
    .step-row .step-id { color: var(--text-muted); font-size: 11px; }
    .step-row .step-label { color: var(--text-title); }
    .step-row .step-args { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .step-row .step-add { margin-left: auto; font-size: 11px; padding: 0 6px; line-height: 16px; }
    .step-block { border-left: 1px dashed var(--line-soft); margin-left: 14px; padding-left: 4px; }
    .step-block-title { font-size: 11px; color: var(--text-muted); padding: 2px 6px; }
    .vars-box { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border-top: 1px solid var(--line-soft); background: var(--bg-subpanel); }
    .vars-box label { font-size: 11px; color: var(--text-muted); }
    .vars-box textarea { width: 100%; height: 68px; resize: vertical; font-family: inherit; font-size: 11px; color: var(--text-code); background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; padding: 4px 6px; }

    .step-form { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field > label { font-size: 11px; color: var(--text-muted); }
    .field .field-desc { font-size: 11px; color: var(--text-muted); }
    .field input[type="text"], .field input[type="number"], .field select { width: 100%; }
    .cond-row { display: grid; grid-template-columns: 1fr 96px 1fr; gap: 6px; }
    .hint { color: var(--text-muted); font-size: 12px; }

    .flow-run { overflow: hidden; }
    .run-toolbar, .gen-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; align-items: center; }
    .run-toolbar label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
    .frame-wrap { position: relative; margin: 0 8px; height: 250px; background: var(--bg-stage-inner); border: 1px solid var(--line-soft); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #frameCanvas { max-width: 100%; max-height: 100%; }
    #frameHint { position: absolute; }
    .run-log { flex: 1; min-height: 80px; overflow: auto; margin: 6px 8px; padding: 6px; font-size: 12px; background: var(--bg-output); border: 1px solid var(--line-soft); border-radius: 4px; }
    .run-log .ok { color: var(--ok); }
    .run-log .fail { color: var(--danger); }
    .run-log .dim { color: var(--text-muted); }
    .gen-code { margin: 0 8px 8px; padding: 8px; min-height: 90px; max-height: 200px; overflow: auto; font-size: 11px; color: var(--text-code); background: var(--bg-output); border: 1px solid var(--line-soft); border-radius: 4px; white-space: pre; }
    #genTask { width: 190px; }
  </style>
</head>
<body>
  <div class="flow-app">
    <header class="flow-topbar">
      <h1>OAS 自定义流程</h1>
      <a href="/tool/annotator">← 返回标注</a>
      <div class="flow-topbar-actions">
        <select id="flowSelect" title="已有流程"></select>
        <input id="flowName" placeholder="流程名（字母数字-_）" title="流程名">
        <button id="newFlowBtn">新建</button>
        <button id="saveFlowBtn">保存</button>
        <button id="delFlowBtn" class="danger">删除</button>
        <label>规则任务 <select id="taskSelect"></select></label>
        <span id="flowStatus"></span>
      </div>
    </header>

    <main class="flow-layout">
      <section class="flow-pane">
        <div class="pane-head">
          <span>步骤</span>
          <select id="addOpSelect" title="选择要添加的步骤类型"></select>
          <button id="addStepBtn">添加到末尾</button>
        </div>
        <div id="stepTree" class="step-tree"><p class="hint">还没有步骤，先在上面选一个类型添加</p></div>
        <div class="vars-box">
          <label for="varsInput">初始变量 (JSON)</label>
          <textarea id="varsInput" spellcheck="false" placeholder="{}"></textarea>
        </div>
      </section>

      <section class="flow-pane">
        <div class="pane-head">
          <span id="editorTitle">步骤参数</span>
          <span class="pane-head-actions">
            <button id="moveUpBtn">上移</button>
            <button id="moveDownBtn">下移</button>
            <button id="dupStepBtn">复制</button>
            <button id="delStepBtn" class="danger">删除</button>
          </span>
        </div>
        <div id="stepForm" class="step-form"><p class="hint">在左侧选择一个步骤</p></div>
      </section>

      <section class="flow-pane flow-run">
        <div class="pane-head"><span>模拟器画面 / 单步测试</span></div>
        <div class="run-toolbar">
          <label>配置 <select id="configSelect"></select></label>
          <button id="startBtn">连接模拟器</button>
          <button id="stopBtn">断开</button>
          <label><input type="checkbox" id="executeChk"> 真实点击</label>
          <button id="runStepBtn">执行本步</button>
        </div>
        <div class="frame-wrap">
          <canvas id="frameCanvas"></canvas>
          <div id="frameHint" class="hint">未连接</div>
        </div>
        <div id="runLog" class="run-log"><p class="hint">执行结果会显示在这里</p></div>
        <div class="pane-head"><span>生成任务代码</span></div>
        <div class="gen-toolbar">
          <input id="genTask" placeholder="目标任务名，如 MyDaily">
          <button id="genBtn">生成 script_task.py</button>
        </div>
        <pre id="genCode" class="gen-code"></pre>
      </section>
    </main>
  </div>
  <script src="/tool/annotator/static/js/flow.js"></script>
</body>
</html>
